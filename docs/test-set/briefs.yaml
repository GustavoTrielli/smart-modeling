# Test set: briefs for comparing AI models and routes
#
# Each case is a brief as the owner would type it into the tool ("words"),
# plus what the owner meant ("meant"): the answer a model's design spec is
# scored against. "meant" is plain words for now; it becomes design spec
# fields once "Define the design spec the language model fills" is settled.
#
# "(assumed)" marks what the brief leaves open: the tool should guess it and
# list it as an assumption. "Swapped" marks a detail v1 doesn't support: the
# tool uses the closest supported one and lists the swap. Garments v1 doesn't
# make at all expect a plain "not in v1" and no draft.
#
# When words and image disagree, the answer key follows what the owner
# confirmed (the photo won in both cases so far: 03 and 16).
#
# Images are NOT in this public repo. They live in the owner's private Google
# Drive folder (linked from the ticket below), under the file name given here,
# and are downloaded when a test runs. Six are photos of the owner's own
# samples, with the label card (garment type, code, piece counts) painted out
# so the model can't read the answer; the owner keeps the originals.
#
# Source: "Collect a test set of real garment descriptions"
# https://github.com/GustavoTrielli/smart-modeling/issues/18

